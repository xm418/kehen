<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="自律监督与每日学习记录" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>刻痕 · 自律与学习记录</title>
    <style>
      html, body { background: #0c0c0c; margin: 0; padding: 0; }

      /* 启动失败兜底：任何阶段抛错都直接显示在屏幕上 */
      #fatal-error {
        position: fixed; inset: 0; z-index: 2147483646;
        background: #1a0000; color: #ffcccb;
        padding: 24px 20px; overflow: auto;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 13px; line-height: 1.5;
        white-space: pre-wrap; word-break: break-word;
        display: none;
      }
      #fatal-error.show { display: block; }
      #fatal-error .title { color: #ff6b6b; font-weight: bold; margin-bottom: 8px; font-size: 15px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="fatal-error"></div>
    <script>
      // 启动兜底：window 错误、未捕获 Promise、3 秒内 #root 仍为空
      (function () {
        var box = document.getElementById('fatal-error')
        var shown = false
        function showError(type, msg, stack) {
          if (!box) return
          shown = true
          box.innerHTML += '\n\n[' + type + '] ' + msg + (stack ? '\n' + stack : '')
          box.classList.add('show')
        }
        window.addEventListener('error', function (e) {
          showError('error', e.message || String(e), e.error && e.error.stack ? e.error.stack : e.filename + ':' + e.lineno)
        }, true)
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason
          showError('unhandledrejection', r instanceof Error ? r.message : String(r), r instanceof Error ? r.stack : '')
        }, true)
        setTimeout(function () {
          var root = document.getElementById('root')
          if (root && root.children.length === 0 && !shown) {
            var info = ''
            try { info += 'UA: ' + navigator.userAgent.slice(0, 160) + '\n' } catch (x) {}
            try { info += 'URL: ' + location.href + '\n' } catch (x) {}
            showError('ROOT_EMPTY', '#root 3 秒内没有 React 子节点', info)
          }
        }, 3000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
